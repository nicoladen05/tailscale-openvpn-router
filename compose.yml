services:
  tailscale-openvpn-router:
    build: .
    container_name: tailscale-openvpn-router
    restart: unless-stopped
    env_file: .env
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
    volumes:
      - ./state:/var/lib/tailscale
      - ./config:/config:ro